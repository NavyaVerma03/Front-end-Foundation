<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
        height:3000px;
        }

        .video-container{
        position:fixed;

        bottom:20px;
        right:20px;

        width:320px;
        height:180px;

        background-color:gray;
        }

        .close-button{
        position:absolute;

        top:-15px;
        left:-15px;

        width:45px;
        height:45px;

        border:none;
        border-radius:50%;

        background-color:black;
        color:white;

        font-size:20px;
        }

        .time{
        position:absolute;

        bottom:10px;
        right:10px;

        background-color:black;
        color:white;

        padding:5px 8px;
        }

  </style>
</head>
<body>
 <div class="video-container">

    <button class="close-button">
      X
    </button>

    <div class="time">
      0:29
    </div>

  </div>

</body>
</html>
