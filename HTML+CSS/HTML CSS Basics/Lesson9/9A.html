<!-- Red Square and Green Circle Box using Div -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape</title>
    <style>
        .Square{
            width: 100px;
            height: 100px;
            background-color: red;
            margin-bottom: 60px;
        }
        .Circle{
            width: 100px;
            height: 100px;
            background-color: green;
            border-radius: 50%;
        }

    </style>
 </head>
 <body>
    <div class="Square"></div>
     <div class="Circle"></div>
 </body>
 </html>
