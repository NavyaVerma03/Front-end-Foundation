<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid with 3 columns</title>
    <style>
        .grid{
            display: grid;
            grid-template-columns: 50px 1fr 75px;
        }

        .grid div{
            padding: 10px;
        }
        .c1{
            background-color: lightblue;
        }
        .c2{
            background-color: lightpink;
        }
        .c3{
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="c1">col1</div>
        <div class="c2">col2</div>
        <div class="c3">col3</div>
    </div>
</body>
</html>
