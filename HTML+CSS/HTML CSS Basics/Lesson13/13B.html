<!--Flexbox inside Flexbox -->

<!DOCTYPE html>
<html>
<head>
  <title>Lesson 13b</title>

  <style>
    .container {
      display: flex;
    }

    .left {
      width: 100px;
      height: 60px;
      background-color: pink;
    }

    .right {
      width: 200px;
      background-color: lightblue;
    }

    .row2-container {
      display: flex;
      justify-content: space-between;
    }

    .row2 {
      background-color: black;
      color: white;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="left"></div>

    <div class="right">
      <div>row1</div>

      <div class="row2-container">
        <div class="row2">row2</div>
        <div class="row2">row2</div>
      </div>
    </div>

  </div>
</body>
</html>
