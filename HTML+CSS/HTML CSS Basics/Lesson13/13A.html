<!-- Nested Flexbox -->

<!DOCTYPE html>
<html>
<head>
  <title>Lesson 13a</title>
  <style>
    .container {
      display: flex;
    }

    .left {
      width: 100px;
      height: 60px;
      background-color: pink;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .right {
      width: 200px;
      background-color: lightblue;
    }

    .item {
      background-color: black;
      color: white;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="left">
      <div class="item">item1</div>
    </div>

    <div class="right"></div>
  </div>
</body>
</html>
