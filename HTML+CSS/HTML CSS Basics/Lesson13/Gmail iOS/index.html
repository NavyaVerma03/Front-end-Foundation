<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail iOS Design</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="email-container">

    <div class="inbox-label">
      ALL INBOXES
    </div>

    <!-- Email 1 -->
    <div class="email">

      <div class="sender-picture-container">
        <img class="sender-picture" src="https://i.pravatar.cc/100?img=12">
      </div>

      <div class="email-content">

        <div class="email-header">
          <div class="sender-name">
            Chewy Promotions
          </div>

          <div class="send-time">
            4:58 PM
          </div>
        </div>

        <div class="subject">
          Biggest sales of the year!
        </div>

        <div class="message">
          Hey there! We're writing to tell you about our...
        </div>

      </div>

    </div>


    <!-- Email 2 -->
    <div class="email">

      <div class="sender-picture-container">
        <img class="sender-picture" src="https://i.pravatar.cc/100?img=22">
      </div>

      <div class="email-content">

        <div class="email-header">
          <div class="sender-name">
            Best Buy
          </div>

          <div class="send-time">
            12:32 PM
          </div>
        </div>

        <div class="subject">
          Your Best Buy eReceipt
        </div>

        <div class="message">
          Thank you for shopping at Best Buy, here is...
        </div>

      </div>

    </div>


    <!-- Email 3 -->
    <div class="email">

      <div class="sender-picture-container">
        <img class="sender-picture" src="https://i.pravatar.cc/100?img=33">
      </div>

      <div class="email-content">

        <div class="email-header">
          <div class="sender-name">
            Netflix
          </div>

          <div class="send-time">
            9:00 AM
          </div>
        </div>

        <div class="subject">
          Here's what's coming soon to Netflix
        </div>

        <div class="message">
          Brand new movies and shows, old favorites...
        </div>

      </div>

    </div>

  </div>

</body>
</html>
