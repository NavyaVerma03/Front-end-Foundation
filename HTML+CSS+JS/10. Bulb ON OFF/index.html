<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulb ON OFF</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">

    <h1>
      Bulb ON / OFF 💡
    </h1>

    <img
    id="bulb"
    src="https://www.w3schools.com/js/pic_bulboff.gif">

    <div class="buttons">

      <button
      class="on-btn"
      onclick="turnOn()">
        ON
      </button>

      <button
      class="off-btn"
      onclick="turnOff()">
        OFF
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
