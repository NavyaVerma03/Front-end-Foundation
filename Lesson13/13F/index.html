<!-- Twitter style post layout using nested flexbox -->

<!DOCTYPE html>
<html>
<head>
  <title>Nested Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="tweet-container">

    <!-- Left side profile image -->
    <div class="profile-section">
      <img src="https://i.pravatar.cc/100?img=12" alt="profile">
    </div>

    <!-- Right side content -->
    <div class="content-section">

      <!-- Username row -->
      <div class="user-info">
        <span class="username">supersimple.dev</span>
        <span class="handle">@SuperSimpleDev</span>
      </div>

      <!-- Tweet text -->
      <div class="tweet-text">
        What is backend web development? A complete overview. New video is up!
      </div>

      <!-- Video preview box -->
      <div class="video-preview">

        <!-- Thumbnail -->
        <div class="thumbnail"></div>

        <!-- Video info -->
        <div class="video-details">
          <div class="website">youtube.com</div>

          <div class="video-title">
            Backend web development - a complete overview (2021)
          </div>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
