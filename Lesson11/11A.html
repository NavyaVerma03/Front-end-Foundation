<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid with 2 Columns</title>
    <style> 
        .grid {
            display: grid;
            grid-template-columns: 200px 75px;
        }

        .grid div {
            padding: 10px;
            color: black;
          
        }
        .col1 {
            background-color: lightblue;
        }
        .col2 {
            background-color: lightcoral;
        }
    </style>

</head>
<body>
    <div class="grid">
        <div class="col1">200px</div>
        <div class="col2">75px</div>
       
    </div>
</body>
</html>
