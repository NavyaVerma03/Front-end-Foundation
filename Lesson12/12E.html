<!-- Slidebar with notification badges -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            font-family: Arial;
        }
        .row{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }
        .badge{
            background-color: #3b82f6;
            color: white;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="row">
            <span>Home</span>
            <span class="badge">14</span>
        </div>
        <div class="row">
            <span>Notifications</span>
            <span class="badge">3</span>
        </div>
        <div class="row">
            <span>Messages</span>
            <span class="badge">5</span>
        </div>
    </div>
</body>
</html>
