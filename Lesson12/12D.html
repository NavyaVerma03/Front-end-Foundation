<!-- Height 50px + gray border + space between -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=.box, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            display: flex;
            height: 50px;
            border: 1px solid gray;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .box div{
            background-color: lightpink;
        }
    </style>
</head>
<body>
    <div class="box">
        <div>item1</div>
        <div>item2</div>
    </div>
</body>
</html>
