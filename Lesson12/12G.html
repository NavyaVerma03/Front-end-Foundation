<!-- Profile list with Follow buttons -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 350px;
            font-family: Arial;
        }

        .profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
         }

        .profile img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .info {
            flex: 1;
            margin-left: 10px;
     }

        .name {
            font-weight: bold;
        }

        .desc {
            color: gray;
        }

        .pop {
            color: gray;
            font-size: 12px;
         }

        .profile button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
     }
                        
    </style>
 </head>
 <body>
    <div class="box">
  
        <div class="profile">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQiWU27Em70MHjbSoe2HbcB3g8Xs1fGTzU4PA&s">
            <div class="info">
            <div class="name">Oliver</div>
            <div class="desc">The Actress</div>
            <div class="pop">Popular</div>
            </div>
            <button>Follow</button>
        </div>

        <div class="profile">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQiWU27Em70MHjbSoe2HbcB3g8Xs1fGTzU4PA&s">
            <div class="info">
            <div class="name">Mimi</div>
            <div class="desc">The Doll</div>
            <div class="pop">Popular</div>
            </div>
            <button>Follow</button>
        </div>

        <div class="profile">
            <img src="https://placedog.net/80/80">
            <div class="info">
            <div class="name">Rex</div>
            <div class="desc">Happy Bulldog</div>
            <div class="pop">Popular</div>
            </div>
            <button>Follow</button>
        </div>

    </div>
 </body>
 </html>
