<!-- 2 items (200px|75px    ) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            display: flex;
          
        }
        .box .item1{
            width:200px;
            background-color: lightblue;
        }
        .box .item2{
            width:75px;
            background-color: lightcoral;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="item1">200px</div>
        <div class="item2">75px</div>
    </div>
</body>
</html>
