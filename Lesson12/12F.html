<!-- Header (Home + Search + Download) -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            display:flex;
            align-items: center;
            justify-content: space-between;
            background-color: #6b4ca3;
            padding: 10px;
            color: white;
            font-family: Arial;
        
        }

        .search{
            flex: 1;
            margin: 0 15px;
            padding: 8px;
            border-radius: 20px;
            border: none;
        }
        .btn{
            background-color: transparent;
            color: white;
            border: 1px solid white;
            padding: 6px 12px;
            border-radius: 4px;
          
        }
    </style>
 </head>
 <body>
    <div class="box">
        <div class="left">Home</div>
        <input class="search" type="text" placeholder="Search">
        <button class="btn">Download</button>
    </div>
 </body>
 </html>
